services:
  dlhd-stremio-addon:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
